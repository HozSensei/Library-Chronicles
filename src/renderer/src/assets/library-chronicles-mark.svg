<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 151 150" fill="none" role="img" aria-label="Library Chronicles">
  <!--
    Marque Library Chronicles : squircle + glyphe calligraphique.
    Source design = PNG ; le masque embarqué permet currentColor sur le « C ».
    Runtime app : préférer AppBrandMark.vue (CSS mask + profile.color).
    Path SVG vectoriel pur : non fourni — OK user pour formats dérivés.
  -->
  <defs>
    <mask id="lc-c-glyph" maskUnits="userSpaceOnUse" x="0" y="0" width="151" height="150">
      <image width="151" height="150" xlink:href="data:image/png;base64,"/>
    </mask>
  </defs>
  <rect width="151" height="150" rx="34" ry="34" fill="#0a0a0a"/>
  <rect width="151" height="150" fill="currentColor" mask="url(#lc-c-glyph)"/>
</svg>
